apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "burnlink.fullname" . }}
  labels:
    {{- include "burnlink.labels" . | nindent 4 }}
spec:
  {{/*
  Ingress and httpRoute are mutually exclusive: both pick an external route
  for the same hostname, and only one may be the deployment's actual front
  door. This guard lives here, not duplicated into templates/ingress.yaml
  and templates/httproute.yaml, because templates/deployment.yaml always
  renders regardless of which routing flag is set (or neither), so a single
  check here fires exactly once, deterministically, however Helm orders
  template execution across files - unlike a guard split across the two
  routing templates themselves, where Helm's own template engine aborts the
  whole render at the first of the two to fail and never reaches the second,
  making only one of two duplicated guards ever observable.
  */}}
  {{- if and .Values.ingress.enabled .Values.httpRoute.enabled }}
  {{ fail "ingress.enabled and httpRoute.enabled cannot both be true: pick one external route and turn the other off." }}
  {{- end }}
  {{- if not .Values.config.store.addr }}
  {{ fail "config.store.addr must be set to the Redis-compatible store's host:port, for example valkey:6379; the service refuses to start without it." }}
  {{- end }}
  {{- if and .Values.existingSecret.name (not .Values.existingSecret.usernameKey) (not .Values.existingSecret.passwordKey) }}
  {{ fail "existingSecret.name is set but neither existingSecret.usernameKey nor existingSecret.passwordKey names a key in it." }}
  {{- end }}
  {{- if and .Values.ingress.enabled (not .Values.config.trustedProxyCidrs) }}
  {{ fail "config.trustedProxyCidrs must be set when ingress.enabled is true: once internal/webapp/requestlink is wired into cmd/burnlink, clientip.NewResolver with no trusted prefixes attributes every request to its TCP peer, which behind this chart's own Ingress is the ingress controller's pod IP, collapsing every per-address rate limit into one shared bucket for the whole link. Set it to the ingress controller's pod or Service CIDR; see README.md." }}
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "burnlink.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "burnlink.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "burnlink.serviceAccountName" . }}
      # This application makes no Kubernetes API calls of its own; see
      # templates/serviceaccount.yaml and values.yaml. Set on the pod too,
      # not only the ServiceAccount, since the pod spec's own value would
      # otherwise win if it were ever left unset here.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: admin
              containerPort: {{ .Values.service.adminPort }}
              protocol: TCP
          env:
            - name: STORE_ADDR
              value: {{ .Values.config.store.addr | quote }}
            {{- if .Values.config.store.tls }}
            - name: STORE_TLS
              value: "true"
            {{- end }}
            {{- if .Values.existingSecret.name }}
            {{- if .Values.existingSecret.usernameKey }}
            - name: STORE_USERNAME_FILE
              value: /var/run/secrets/burnlink-store/username
            {{- end }}
            {{- if .Values.existingSecret.passwordKey }}
            - name: STORE_PASSWORD_FILE
              value: /var/run/secrets/burnlink-store/password
            {{- end }}
            {{- end }}
            {{- if .Values.config.trustedProxyCidrs }}
            - name: TRUSTED_PROXY_CIDRS
              value: {{ .Values.config.trustedProxyCidrs | quote }}
            {{- end }}
          {{- if .Values.existingSecret.name }}
          volumeMounts:
            - name: store-credentials
              mountPath: /var/run/secrets/burnlink-store
              readOnly: true
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.existingSecret.name }}
      volumes:
        - name: store-credentials
          secret:
            secretName: {{ .Values.existingSecret.name | quote }}
            defaultMode: 0440
            items:
              {{- if .Values.existingSecret.usernameKey }}
              - key: {{ .Values.existingSecret.usernameKey | quote }}
                path: username
              {{- end }}
              {{- if .Values.existingSecret.passwordKey }}
              - key: {{ .Values.existingSecret.passwordKey | quote }}
                path: password
              {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
