services:
  burnlink:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ADDR: ":8080"
      ADMIN_ADDR: ":8081"
      LOG_LEVEL: "debug"
      # Valkey below, reached by its service name. STORE_USERNAME and
      # STORE_PASSWORD, or their _FILE twins, are set the same way once the
      # store requires authentication; see .env.example.
      STORE_ADDR: "valkey:6379"
      # Limits of a stored secret and the per client rate limit. These are the
      # application defaults, spelled out so a local run shows what to tune.
      # Behind a reverse proxy also set TRUSTED_PROXY_CIDRS; see .env.example.
      SECRET_MAX_BYTES: "1048576"
      SECRET_LIFETIME_MIN: "1m"
      SECRET_LIFETIME_MAX: "7d"
      SECRET_LIFETIME_DEFAULT: "24h"
      RATE_LIMIT_BURST: "10"
      RATE_LIMIT_PER: "1m"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    depends_on:
      - valkey

  # The deployment's store. Local development only: no authentication, no
  # published port, and no volume, so a restart drops every secret, which is
  # what a one time secret store should do anyway.
  # The tag is a major tag on purpose. Renovate pins the digest (pinDigests in
  # the shared preset), and the first pin is the manifest list digest. The tag
  # was not checked against the registry offline.
  valkey:
    image: docker.io/valkey/valkey:9@sha256:3ab0eca823ebbf0fe352476ebac330ac9e5f14b592b9a954eab296d341e81b0e
    restart: unless-stopped
