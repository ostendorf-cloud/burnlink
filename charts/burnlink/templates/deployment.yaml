apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "burnlink.fullname" . }}
  labels:
    {{- include "burnlink.labels" . | nindent 4 }}
spec:
  {{/*
  Ingress and httpRoute are mutually exclusive: both pick an external route
  for the same hostname, and only one may be the deployment's actual front
  door. This guard lives here, not duplicated into templates/ingress.yaml
  and templates/httproute.yaml, because templates/deployment.yaml always
  renders regardless of which routing flag is set (or neither), so a single
  check here fires exactly once, deterministically, however Helm orders
  template execution across files - unlike a guard split across the two
  routing templates themselves, where Helm's own template engine aborts the
  whole render at the first of the two to fail and never reaches the second,
  making only one of two duplicated guards ever observable.
  */}}
  {{- if and .Values.ingress.enabled .Values.httpRoute.enabled }}
  {{ fail "ingress.enabled and httpRoute.enabled cannot both be true: pick one external route and turn the other off." }}
  {{- end }}
  {{- if not .Values.config.store.addr }}
  {{ fail "config.store.addr must be set to the Redis-compatible store's host:port, for example valkey:6379; the service refuses to start without it." }}
  {{- end }}
  {{- if and .Values.existingSecret.name (not .Values.existingSecret.usernameKey) (not .Values.existingSecret.passwordKey) }}
  {{ fail "existingSecret.name is set but neither existingSecret.usernameKey nor existingSecret.passwordKey names a key in it." }}
  {{- end }}
  {{- if and .Values.ingress.enabled (not .Values.config.trustedProxies) }}
  {{ fail "config.trustedProxies must be set when ingress.enabled is true: clientip.NewResolver with no trusted prefixes attributes every request to its TCP peer, which behind this chart's own Ingress is the ingress controller's pod IP, collapsing every per-address rate limit into one shared bucket for every sender. Set it to the ingress controller's pod or Service CIDR; see README.md." }}
  {{- end }}
  {{- if and .Values.config.umami.url .Values.config.umami.websiteId (not .Values.config.siteHost) }}
  {{ fail "config.siteHost must be set to the public host when config.umami.url and config.umami.websiteId are set: it is the hostname every counted page view carries." }}
  {{- end }}
  {{- if and (or .Values.config.umami.url .Values.config.umami.websiteId) (not (and .Values.config.umami.url .Values.config.umami.websiteId)) }}
  {{ fail "config.umami.url and config.umami.websiteId must be set together or not at all." }}
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "burnlink.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "burnlink.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "burnlink.serviceAccountName" . }}
      # This application makes no Kubernetes API calls of its own; see
      # templates/serviceaccount.yaml and values.yaml. Set on the pod too,
      # not only the ServiceAccount, since the pod spec's own value would
      # otherwise win if it were ever left unset here.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: admin
              containerPort: {{ .Values.service.adminPort }}
              protocol: TCP
          env:
            - name: STORE_ADDR
              value: {{ .Values.config.store.addr | quote }}
            {{- if .Values.config.store.tls }}
            - name: STORE_TLS
              value: "true"
            {{- end }}
            {{- if .Values.existingSecret.name }}
            {{- if .Values.existingSecret.usernameKey }}
            - name: STORE_USERNAME_FILE
              value: /var/run/secrets/burnlink-store/username
            {{- end }}
            {{- if .Values.existingSecret.passwordKey }}
            - name: STORE_PASSWORD_FILE
              value: /var/run/secrets/burnlink-store/password
            {{- end }}
            {{- end }}
            {{- if .Values.config.trustedProxies }}
            - name: TRUSTED_PROXIES
              value: {{ .Values.config.trustedProxies | quote }}
            {{- end }}
            {{- /* int64 keeps a large number from rendering as 1.048576e+06. */}}
            {{- if .Values.config.secrets.maxBytes }}
            - name: SECRET_MAX_BYTES
              value: {{ .Values.config.secrets.maxBytes | int64 | quote }}
            {{- end }}
            {{- if .Values.config.secrets.lifetimeMin }}
            - name: SECRET_LIFETIME_MIN
              value: {{ .Values.config.secrets.lifetimeMin | quote }}
            {{- end }}
            {{- if .Values.config.secrets.lifetimeMax }}
            - name: SECRET_LIFETIME_MAX
              value: {{ .Values.config.secrets.lifetimeMax | quote }}
            {{- end }}
            {{- if .Values.config.secrets.lifetimeDefault }}
            - name: SECRET_LIFETIME_DEFAULT
              value: {{ .Values.config.secrets.lifetimeDefault | quote }}
            {{- end }}
            {{- if .Values.config.rateLimit.burst }}
            - name: RATE_LIMIT_BURST
              value: {{ .Values.config.rateLimit.burst | int64 | quote }}
            {{- end }}
            {{- if .Values.config.rateLimit.per }}
            - name: RATE_LIMIT_PER
              value: {{ .Values.config.rateLimit.per | quote }}
            {{- end }}
            {{- if .Values.config.siteHost }}
            - name: SITE_HOST
              value: {{ .Values.config.siteHost | quote }}
            {{- end }}
            {{- if .Values.config.umami.url }}
            - name: UMAMI_URL
              value: {{ .Values.config.umami.url | quote }}
            {{- end }}
            {{- if .Values.config.umami.websiteId }}
            - name: UMAMI_WEBSITE_ID
              value: {{ .Values.config.umami.websiteId | quote }}
            {{- end }}
          {{- if .Values.existingSecret.name }}
          volumeMounts:
            - name: store-credentials
              mountPath: /var/run/secrets/burnlink-store
              readOnly: true
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.existingSecret.name }}
      volumes:
        - name: store-credentials
          secret:
            secretName: {{ .Values.existingSecret.name | quote }}
            defaultMode: 0440
            items:
              {{- if .Values.existingSecret.usernameKey }}
              - key: {{ .Values.existingSecret.usernameKey | quote }}
                path: username
              {{- end }}
              {{- if .Values.existingSecret.passwordKey }}
              - key: {{ .Values.existingSecret.passwordKey | quote }}
                path: password
              {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
