# Default values for burnlink.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# No single-replica guard here: this scaffold keeps no server-side session
# state, so more than one replica, or two pods briefly coexisting during an
# ordinary rolling update, is harmless. Revisit this if a later milestone
# ever adds in-process state that a request has to stick to one pod for.
replicaCount: 1

image:
  repository: ghcr.io/ostendorf-cloud/burnlink
  # Defaults to .Chart.AppVersion when left empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # No RBAC is created: this application makes no Kubernetes API calls of its own.
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Matches the Dockerfile's distroless "nonroot" base image, uid/gid 65532.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  # Also used as the container port and for the probes. This is the only
  # port the chart's own Ingress or HTTPRoute ever routes to.
  port: 8080
  # govue's admin listener: health, readiness and metrics, never routed by
  # this chart's own Ingress or HTTPRoute (templates/ingress.yaml and
  # templates/httproute.yaml only ever reference service.port above).
  # Reached only from inside the cluster, by a kubelet's probe or a
  # Prometheus ServiceMonitor/PodMonitor (not part of this chart).
  adminPort: 8081

# Ingress and httpRoute below are two ways to reach this chart's own Service
# externally, chosen by their own enabled flag. Mutually exclusive (see
# templates/deployment.yaml's own fail guard): an install never renders
# both for the same hostname. Both default to false, so a default install
# renders no external route at all until one of the two is chosen.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: burnlink.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API alternative to ingress above; see that block's own comment for
# the mutual-exclusion rule.
#
# The HTTPRoute and Gateway kinds are Gateway API CRDs. This chart never
# ships them and never creates the Gateway itself: both the CRDs and a
# running Gateway with a listener that allows this release's namespace are
# prerequisites, provisioned once per cluster, not by this chart.
httpRoute:
  enabled: false
  # Hostnames this HTTPRoute matches, mirroring ingress.hosts' host field.
  # A Gateway listener's own hostname (and allowedRoutes) still decides
  # whether traffic for one of these actually reaches this HTTPRoute.
  hostnames: []
  annotations: {}
  # Routing is fixed to this chart's own Service on service.port: no
  # values-driven way to add a second backend or a per-path rule, the same
  # single-backend shape ingress.hosts already assumes. An HTTPRoute rule
  # with no "matches" defaults to a "/" prefix match per the Gateway API
  # spec, the same default an Ingress with one "/" path rule gives.
  parentRefs:
    # Name of the Gateway this HTTPRoute attaches to. Required when
    # httpRoute.enabled is true.
    name: ""
    # Namespace the Gateway lives in. Required when httpRoute.enabled is
    # true: a Gateway is usually platform owned and lives in a different
    # namespace than this release, and Gateway API's own parentRefs
    # defaults an unset namespace to the HTTPRoute's own namespace, which
    # is normally wrong here. The Gateway's own allowedRoutes still decides
    # whether this reference is actually honoured.
    namespace: ""
    # Optional: the specific listener to attach to, when the Gateway
    # exposes more than one, for example separate HTTP and HTTPS
    # listeners.
    sectionName: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    # No CPU limit: serving the SPA bundle is bursty on a page load, not
    # broken for being briefly busy. A memory limit stays in place as a
    # safety net against a genuine leak.
    memory: 128Mi

startupProbe:
  # Disabled by default: startup only loads the embedded frontend, which is
  # not expected to be slow enough to need one.
  enabled: false
  initialDelaySeconds: 0
  periodSeconds: 5
  failureThreshold: 30

livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

# cmd/burnlink/main.go hardcodes its listen addresses; config below carries
# the settings internal/config loads from the environment, and nothing else.
config:
  # The Redis-compatible store the service keeps secrets in; the deployment
  # runs Valkey. The chart deploys no store itself.
  store:
    # host:port, fed into STORE_ADDR. Required: templates/deployment.yaml
    # rejects a render that leaves it empty, because the service refuses to
    # start without it.
    addr: ""
    # Connect over TLS, fed into STORE_TLS.
    tls: false

  # Fed into TRUSTED_PROXY_CIDRS, which internal/config parses into
  # internal/webapp/requestlink's client address resolution once that
  # handler is wired into this binary; see the root AGENTS.md. Left empty,
  # the resolver trusts no proxy and attributes every request to its TCP
  # peer, the secure default behind no proxy at all, but the wrong one
  # behind this chart's own Ingress, where every submitter would otherwise
  # collapse onto the ingress controller's own pod address once that
  # wiring lands. templates/deployment.yaml rejects an install or template
  # render that leaves this empty while ingress.enabled is true.
  trustedProxyCidrs: ""

# The store's credentials. This chart never creates a Secret from plaintext
# values: name an existing Secret that holds them. The Secret is mounted as
# files and reaches the service through STORE_USERNAME_FILE and
# STORE_PASSWORD_FILE, so no credential appears in the pod's environment.
# Both keys are optional, for a store with no authentication or no ACL user;
# leave name empty to mount nothing.
existingSecret:
  # Name of the Secret, in the release's namespace.
  name: ""
  # Key in that Secret holding the ACL username. Empty means unused.
  usernameKey: ""
  # Key in that Secret holding the password. Empty means unused.
  passwordKey: ""
