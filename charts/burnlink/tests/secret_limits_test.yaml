suite: secret limits and rate limit
templates:
  - templates/deployment.yaml
set:
  config:
    store:
      addr: valkey:6379
tests:
  - it: leaves every limit to the application default when nothing is set
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 1

  - it: wires every limit when all are set
    set:
      config:
        secrets:
          maxBytes: 2048
          lifetimeMin: 30s
          lifetimeMax: 2d
          lifetimeDefault: 1h
        rateLimit:
          burst: 5
          per: 30s
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SECRET_MAX_BYTES
            value: "2048"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SECRET_LIFETIME_MIN
            value: 30s
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SECRET_LIFETIME_MAX
            value: 2d
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SECRET_LIFETIME_DEFAULT
            value: 1h
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RATE_LIMIT_BURST
            value: "5"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RATE_LIMIT_PER
            value: 30s

  - it: renders a large size limit as a plain integer
    set:
      config:
        secrets:
          maxBytes: 10485760
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SECRET_MAX_BYTES
            value: "10485760"

  - it: wires only the limit that is set
    set:
      config:
        rateLimit:
          burst: 3
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 2
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RATE_LIMIT_BURST
            value: "3"

  - it: rejects a size limit that is not a number
    set:
      config:
        secrets:
          maxBytes: big
    asserts:
      - failedTemplate: {}
